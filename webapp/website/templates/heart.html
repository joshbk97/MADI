{% extends "disease_page.html" %}
{% block page %}

<div class="container disease-header text-center madi-animate">
    <h2 style="color: var(--accent-primary); font-size: 2.5rem;">Heart Disease Prediction</h2>
    <p style="color: var(--text-muted);">Please provide the following clinical parameters to run the diagnostic model.</p>
</div>

<div class="container" style="padding-bottom: 100px;">
    <div class="row">
        <div class="col-md-10 col-md-offset-1">
            <div class="glass-panel madi-animate" data-delay="150">
                <div class="madi-form-progress-text" id="formProgressText">0% Complete</div>
                <div class="madi-form-progress"><div class="madi-form-progress-bar" id="formProgressBar"></div></div>
                <form action="{{ url_for('prediction.predict') }}" method="POST">
                    <input type="hidden" name="madi_model" value="heart">
                    <div class="row">
                        <!-- Column 1 -->
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="age" class="form-label">Age</label>
                                <input class="form-control" type="number" min="0" required name="age" placeholder="e.g. 55">
                            </div>
                            
                            <div class="form-group">
                                <label for="Gender" class="form-label">Gender</label>
                                <select class="form-control" name="Gender" required>
                                    <option value="1">Male</option>
                                    <option value="0">Female</option>
                                </select>
                            </div>
                              
                            <div class="form-group">
                                <label for="cp" class="form-label">Chest Pain Type</label>
                                <select class="form-control" name="cp" required>
                                    <option value="0">Typical Angina</option>
                                    <option value="1">Atypical Angina</option>
                                    <option value="2">Non-Anginal Pain</option>
                                    <option value="3">Asymptomatic</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="trestbps" class="form-label">Resting Blood Pressure (mm Hg)</label>
                                <input class="form-control" type="number" min="0" name="trestbps" required placeholder="e.g. 130">
                            </div>

                            <div class="form-group">
                                <label for="chol" class="form-label">Serum Cholestoral (mg/dl)</label>
                                <input class="form-control" type="number" min="0" step="any" name="chol" required placeholder="e.g. 240">
                            </div>
                            
                            <div class="form-group">
                                <label for="fbs" class="form-label">Fasting Blood Sugar > 120 mg/dl</label>
                                <select class="form-control" name="fbs" required>
                                    <option value="0">No</option>
                                    <option value="1">Yes</option>
                                </select>
                            </div>
                        </div>

                        <!-- Column 2 -->
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="restecg" class="form-label">Resting ECG Results</label>
                                <select class="form-control" name="restecg" required>
                                    <option value="0">Normal</option>
                                    <option value="1">ST-T Wave Abnormality</option>
                                    <option value="2">Left Ventricular Hypertrophy</option>
                                </select>
                            </div>
                            
                            <div class="form-group">
                                <label for="thalach" class="form-label">Maximum Heart Rate Achieved</label>
                                <input class="form-control" type="number" min="0" step="any" name="thalach" required placeholder="e.g. 150">
                            </div>

                            <div class="form-group">
                                <label for="exang" class="form-label">Exercise Induced Angina</label>
                                <select class="form-control" name="exang" required>
                                    <option value="0">No</option>
                                    <option value="1">Yes</option>
                                </select>
                            </div>
                            
                            <div class="form-group">
                                <label for="oldpeak" class="form-label">ST Depression Induced by Exercise</label>
                                <input class="form-control" type="number" min="0" step="any" name="oldpeak" required placeholder="e.g. 1.5">
                            </div>
                            
                            <div class="form-group">
                                <label for="slope" class="form-label">Slope of Peak Exercise ST Segment</label>
                                <select class="form-control" name="slope" required>
                                    <option value="0">Upsloping (0)</option>
                                    <option value="1">Flat (1)</option>
                                    <option value="2">Downsloping (2)</option>
                                </select>
                            </div>
                            
                            <div class="form-group" style="margin-top: 40px; text-align: right;">
                                <button type="submit" class="btn btn-madi">Run Diagnosis <i class="fa fa-arrow-right" style="margin-left: 8px;"></i></button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
