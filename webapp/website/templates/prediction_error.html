{% extends "base.html" %}
{% block content %}
<div class="container" style="padding-top: 120px; padding-bottom: 100px;">
    <div class="row">
        <div class="col-md-8 col-md-offset-2">
            <div class="glass-panel text-center madi-animate" style="padding: 48px 32px;">
                <i class="fa fa-exclamation-circle madi-shake" style="font-size: 48px; color: var(--danger); margin-bottom: 20px; display: inline-block;"></i>
                <h2 style="color: var(--text-main); margin-bottom: 16px;">{{ title }}</h2>
                <p style="color: var(--text-muted); font-size: 1.05rem; max-width: 520px; margin: 0 auto 28px;">{{ message }}</p>
                <a href="{{ url_for('views.home') }}#models" class="btn btn-madi" style="margin-right: 12px;">Back to models</a>
                <a href="{{ url_for('views.dashboard') }}" class="btn btn-madi-outline">Dashboard</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
