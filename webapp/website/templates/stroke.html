{% extends "disease_page.html" %}
{% block page %}

<div class="container disease-header text-center madi-animate">
    <h2 style="color: var(--accent-primary); font-size: 2.5rem;">Stroke Risk Prediction</h2>
    <p style="color: var(--text-muted);">Please provide the following clinical parameters to run the diagnostic model.</p>
</div>

<div class="container" style="padding-bottom: 100px;">
    <div class="row">
        <div class="col-md-10 col-md-offset-1">
            <div class="glass-panel madi-animate" data-delay="150">
                <div class="madi-form-progress-text" id="formProgressText">0% Complete</div>
                <div class="madi-form-progress"><div class="madi-form-progress-bar" id="formProgressBar"></div></div>
                <form action="{{ url_for('prediction.predict') }}" method="POST">
                    <input type="hidden" name="madi_model" value="stroke">
                    <div class="row">
                        <!-- Column 1 -->
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="age" class="form-label">Age</label>
                                <input class="form-control" type="number" min="0" required name="age" placeholder="e.g. 60">
                            </div>
                            
                            <div class="form-group">
                                <label for="Gender" class="form-label">Gender</label>
                                <select class="form-control" name="Gender" required>
                                    <option value="1">Male</option>
                                    <option value="0">Female</option>
                                </select>
                            </div>
                              
                            <div class="form-group">
                                <label for="avg_glucose_level" class="form-label">Average Glucose Level</label>
                                <input class="form-control" type="number" min="0" step="any" name="avg_glucose_level" required placeholder="e.g. 105.5">
                            </div>

                            <div class="form-group">
                                <label for="hypertension" class="form-label">Hypertension History</label>
                                <select class="form-control" name="hypertension" required>
                                    <option value="0">No</option>
                                    <option value="1">Yes</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="heart_disease" class="form-label">Heart Disease History</label>
                                <select class="form-control" name="heart_disease" required>
                                    <option value="0">No</option>
                                    <option value="1">Yes</option>
                                </select>
                            </div>
                        </div>

                        <!-- Column 2 -->
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="ever_married" class="form-label">Ever Married?</label>
                                <select class="form-control" name="ever_married" required>
                                    <option value="0">No</option>
                                    <option value="1">Yes</option>
                                </select>
                            </div>
                            
                            <div class="form-group">
                                <label for="work_type" class="form-label">Work Type</label>
                                <select class="form-control" name="work_type" required>
                                    <option value="0">Private Sector</option>
                                    <option value="1">Self Employed</option>
                                    <option value="2">Government Job</option>
                                    <option value="3">Stay at home</option>
                                    <option value="4">Never Worked</option>
                                </select>
                            </div>
                            
                            <div class="form-group">
                                <label for="Residence_type" class="form-label">Residence Type</label>
                                <select class="form-control" name="Residence_type" required>
                                    <option value="1">Urban</option>
                                    <option value="0">Rural</option>
                                </select>
                            </div>
                            
                            <div class="form-group">
                                <label for="Smoking_status" class="form-label">Smoking Status</label>
                                <select class="form-control" name="Smoking_status" required>
                                    <option value="0">Never Smoked</option>
                                    <option value="1">Sometimes</option>
                                    <option value="2">Formerly Smoked</option>
                                    <option value="3">Smokes Currently</option>
                                </select>
                            </div>
                            
                            <div class="form-group" style="margin-top: 40px; text-align: right;">
                                <button type="submit" class="btn btn-madi">Run Diagnosis <i class="fa fa-arrow-right" style="margin-left: 8px;"></i></button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
