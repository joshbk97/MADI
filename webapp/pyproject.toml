[tool.poetry]
name = "madi-healthcare-ai"
version = "1.0.0"
description = "Medical Analysis & Diagnostics Intelligence"
authors = ["Josh B <joshbk97@github.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.9,<3.13"
flask = "^2.3"
flask-sqlalchemy = "^3.1"
flask-login = "^0.6"
werkzeug = "^2.3"
numpy = "^1.24"
scikit-learn = "^1.3"
xgboost = "^2.0"
tensorflow = "^2.15"
pillow = "^10.0"
gunicorn = "^21.0"
google-generativeai = "^0.5"
python-dotenv = "^1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
